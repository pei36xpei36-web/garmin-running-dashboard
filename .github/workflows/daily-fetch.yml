name: Daily Garmin Fetch

on:
  schedule:
    # UTC 22:00 = 台灣時間 06:00，每天自動抓前一天的資料
    - cron: "0 22 * * *"
  workflow_dispatch: {}   # 也可到 Actions 頁面手動按「Run workflow」

permissions:
  contents: write   # 給保活步驟 push 空 commit 用

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 抓取最新資料到 Supabase
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python fetch_data.py --update

      - name: 保活（避免倉庫 60 天無提交被 GitHub 自動停用排程）
        if: always()   # 即使抓資料失敗也要保活
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "距上次提交 ${age_days} 天"
          if [ "$age_days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (保持排程啟用)"
            git push
          fi
